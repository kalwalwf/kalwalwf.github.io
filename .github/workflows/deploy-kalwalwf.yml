name: Deploy KWF to KalwalWF Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-kalwalwf.yml'
      - 'password-recovery.js'
      - 'password-recovery.css'
      - 'kwf-admin-updates.js'
      - 'kwf-admin-updates.css'
      - 'kwf-auth-fixes.js'
      - 'kwf-auth-fixes.css'
      - 'kwf-accounts-v2.js'
      - 'kwf-accounts-v2.css'
      - 'kwf-portal-v3.js'
      - 'kwf-portal-v3.css'
      - 'kwf-connection-v3.js'
      - 'kwf-connection-v3.css'
      - 'kwf-supabase-entry.mjs'
      - 'smoke-test.cjs'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kalwalwf-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new KalwalWF site
        uses: actions/checkout@v4

      - name: Checkout existing public KWF site source
        uses: actions/checkout@v4
        with:
          repository: talhakalwal21/kwf-welfare-web
          ref: main
          path: kwf-original
          persist-credentials: false

      - name: Assemble website with annual dashboard and delete controls
        shell: bash
        env:
          KWF_SUPABASE_URL: ${{ vars.KWF_SUPABASE_URL }}
          KWF_SUPABASE_PUBLIC_KEY: ${{ vars.KWF_SUPABASE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q kwf-original/KWF_PC_Pages_Website.zip -d _site
          test -f _site/index.html
          test -f _site/app.js
          # Keep the Supabase client on the same GitHub Pages origin to avoid a
          # third-party CDN timeout showing a false "not connected" message.
          npm install --no-save --no-audit --no-fund @supabase/supabase-js@2.57.0 esbuild@0.25.12
          ./node_modules/.bin/esbuild kwf-supabase-entry.mjs --bundle --format=esm --platform=browser --target=es2020 --minify --outfile=_site/supabase-sdk.js
          test -s _site/supabase-sdk.js
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('_site/app.js')
          old=p.read_text(encoding='utf-8')
          needle="const isStaff=()=>['admin','owner'].includes(state.profile?.role);"
          assert old.count(needle)==1, 'Expected base isStaff role gate'
          p.write_text(old.replace(needle,"const isStaff=()=>['admin','owner','staff'].includes(state.profile?.role);"),encoding='utf-8')
          PY
          cat kwf-original/website-enhancements.js >> _site/app.js
          cat kwf-original/website-enhancements.css >> _site/style.css
          cat password-recovery.js >> _site/app.js
          cat password-recovery.css >> _site/style.css
          cat kwf-admin-updates.js >> _site/app.js
          cat kwf-admin-updates.css >> _site/style.css
          cat kwf-auth-fixes.js >> _site/app.js
          cat kwf-auth-fixes.css >> _site/style.css
          cat kwf-accounts-v2.js >> _site/app.js
          cat kwf-accounts-v2.css >> _site/style.css
          cat kwf-portal-v3.js >> _site/app.js
          cat kwf-portal-v3.css >> _site/style.css
          cat kwf-connection-v3.js >> _site/app.js
          cat kwf-connection-v3.css >> _site/style.css
          # Both initial auth and old-password verification now load from Pages.
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('_site/app.js')
          source=p.read_text(encoding='utf-8')
          cdn="import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/+esm')"
          assert source.count(cdn)>=2, 'Expected both Supabase SDK imports'
          source=source.replace(cdn,"import('./supabase-sdk.js')")
          p.write_text(source,encoding='utf-8')
          PY
          node --check _site/app.js
          node --check _site/supabase-sdk.js
          node smoke-test.cjs _site/app.js
          grep -q 'kwfStaffInvite' _site/app.js
          grep -q 'kwfResendVerification' _site/app.js
          grep -q 'kwf-modal' _site/style.css
          # Use unique asset URLs on each deployment so old CSS/JS cannot
          # make login buttons invisible or hide the updated admin controls.
          python3 - <<'PY'
          import os, pathlib
          p=pathlib.Path('_site/index.html')
          markup=p.read_text(encoding='utf-8')
          version=os.environ.get('GITHUB_SHA','')[:12]
          for name in ('style.css','app.js','config.js'):
            markup=markup.replace('./'+name+'"','./'+name+'?v='+version+'"')
          p.write_text(markup,encoding='utf-8')
          assert '?v='+version in markup
          PY
          # Use GitHub public variables if configured. Otherwise, copy the
          # publishable-key-only config already live on the existing site.
          if [[ -n "$KWF_SUPABASE_URL" && -n "$KWF_SUPABASE_PUBLIC_KEY" ]]; then
            python3 - <<'PY'
          import json, os, pathlib
          values = {
            'supabaseUrl': os.environ['KWF_SUPABASE_URL'].strip(),
            'supabasePublishableKey': os.environ['KWF_SUPABASE_PUBLIC_KEY'].strip(),
            'foundationName': 'Kalwal Welfare Foundation',
          }
          pathlib.Path('_site/config.js').write_text(
            'window.KWF_CONFIG = Object.freeze(' + json.dumps(values) + ');\n',
            encoding='utf-8'
          )
          PY
          else
            curl --fail --location --retry 3 --retry-delay 2 --silent --show-error \
              https://talhakalwal21.github.io/kwf-welfare-web/config.js \
              --output _site/config.js
          fi
          grep -q 'KWF_CONFIG' _site/config.js
          grep -Eq 'sb_publishable_|eyJ' _site/config.js
          # Public publishable-only config is embedded directly in index.html,
          # removing an extra script request that fails on slow connections.
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('_site/index.html')
          config=pathlib.Path('_site/config.js').read_text(encoding='utf-8').strip()
          assert 'window.KWF_CONFIG' in config
          assert not any(secret in config.lower() for secret in ('service_role','sb_secret_'))
          html=p.read_text(encoding='utf-8')
          import re
          pattern=r'<script src="\\./config\\.js(?:\\?v=[^"]+)?"></script>'
          html,count=re.subn(pattern,lambda _m:'<script>'+config.replace('</script','<\\/script')+'</script>',html)
          assert count==1, 'Index expected exactly one cache-busted config script'
          placeholder='<div id="app" aria-live="polite"></div>'
          assert placeholder in html
          html=html.replace(placeholder,'<div id="app" aria-live="polite"><div style="margin:22vh auto;max-width:420px;padding:24px;text-align:center;font:16px system-ui,sans-serif;color:#19523b">KWF Welfare Portal — Connecting…</div></div>')
          p.write_text(html,encoding='utf-8')
          PY
          test -s _site/supabase-sdk.js
          touch _site/.nojekyll
          echo 'KWF website ready with public Supabase connection.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy KWF website
        id: deployment
        uses: actions/deploy-pages@v4
